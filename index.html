<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
    <title>Australian Music Festival Landscape</title>
   
</head>
<body>
    <h1>Australian Music Festival Landscape (Week 10 Homework Task)</h1>
    <div id="vis1"></div>

    <script>
    var spec1 = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "title": {
        "fontSize": 24,
        "font": "sans-serif",
        "fontWeight": "bold",
        "anchor": "middle",
        "color": "#2c3e50"
      },
      "params": [
        {
          "name": "revenue_filter",
          "value": 0,
          "bind": {
            "input": "range",
            "min": 0,
            "max": 150,
            "step": 10,
            "name": "Minimum Per Capita Revenue ($): "
          }
        }
      ],
      "vconcat": [
        {
          "hconcat": [
            {
              "width": 480,
              "height": 380,
              "title": {
                "text": "Total Music Revenue by State",
                "fontSize": 16,
              },
              "data": { "url": "music_revenue_by_state.csv" },
              "transform": [
                {"filter": "datum.per_capita_revenue >= revenue_filter"}
              ],
              "layer": [
                {
                  "mark": {"type": "bar", "cornerRadiusEnd": 4},
                  "encoding": {
                    "x": {
                      "field": "state",
                      "type": "nominal",
                      "title": "State",
                      "axis": {"labelAngle": 0, "labelFontSize": 11},
                      "sort": "-y"
                    },
                    "y": {
                      "field": "total_revenue",
                      "type": "quantitative",
                      "title": "Total Revenue (AUD)",
                      "axis": {"format": "$~s"}
                    },
                    "color": {
                      "field": "total_revenue",
                      "type": "quantitative",
                      "scale": {"scheme": "blues"},
                      "legend": null
                    },
                    "tooltip": [
                      {"field": "state_full", "type": "nominal", "title": "State"},
                      {"field": "total_revenue", "type": "quantitative", "title": "Total Revenue", "format": "$,.0f"},
                      {"field": "per_capita_revenue", "type": "quantitative", "title": "Per Capita", "format": "$,.2f"},
                      {"field": "population", "type": "quantitative", "title": "Population", "format": ","}
                    ]
                  }
                },
                {
                  "mark": {
                    "type": "text",
                    "align": "center",
                    "baseline": "bottom",
                    "dy": -5,
                    "fontSize": 10,
                    "fontWeight": "bold"
                  },
                  "encoding": {
                    "x": {"field": "state", "type": "nominal", "sort": "-y"},
                    "y": {"field": "total_revenue", "type": "quantitative"},
                    "text": {"field": "total_revenue", "type": "quantitative", "format": "$~s"}
                  }
                }
              ]
            },
            {
              "width": 480,
              "height": 380,
              "title": {
                "text": "Per Capita Revenue",
                "fontSize": 16,
              },
              "data": { "url": "per_capita_revenue_vs_festivals.csv" },
              "transform": [
                {"filter": "datum.per_capita_revenue >= revenue_filter"}
              ],
              "layer": [
                {
                  "mark": {"type": "point", "filled": true, "size": 250},
                  "encoding": {
                    "x": {
                      "field": "festivals",
                      "type": "quantitative",
                      "title": "Number of Festivals Hosted",
                      "scale": {"zero": true, "domain": [0, 25]}
                    },
                    "y": {
                      "field": "per_capita_revenue",
                      "type": "quantitative",
                      "title": "Per Capita Revenue ($)",
                      "scale": {"zero": true}
                    },
                    "color": {
                      "field": "per_capita_revenue",
                      "type": "quantitative",
                      "scale": {"scheme": "orangered"},
                      "legend": {"title": "Per Capita ($)"}
                    },
                    "size": {
                      "field": "population",
                      "type": "quantitative",
                      "title": "Population",
                      "scale": {"range": [200, 1500]}
                    },
                    "tooltip": [
                      {"field": "state_full", "type": "nominal", "title": "State"},
                      {"field": "per_capita_revenue", "type": "quantitative", "title": "Per Capita Revenue", "format": "$,.2f"},
                      {"field": "festivals", "type": "quantitative", "title": "Festivals"},
                      {"field": "population", "type": "quantitative", "title": "Population", "format": ","}
                    ]
                  }
                },
                {
                  "mark": {"type": "text", "dy": -20, "fontSize": 11, "fontWeight": "bold"},
                  "encoding": {
                    "x": {"field": "festivals", "type": "quantitative"},
                    "y": {"field": "per_capita_revenue", "type": "quantitative"},
                    "text": {"field": "state", "type": "nominal"},
                    "color": {"value": "#2c3e50"}
                  }
                }
              ]
            }
          ]
        }
      ]
    };

    vegaEmbed("#vis1", spec1).catch(console.error);
    </script>
</body>
</html>
